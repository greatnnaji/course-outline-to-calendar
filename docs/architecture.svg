<svg width="100%" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title>Course Outline to Calendar — Architecture Diagram</title>
  <desc>Three-layer architecture: Next.js frontend, FastAPI backend, and LangChain AI pipeline, with data flow from PDF upload to ICS calendar export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="640" rx="12" fill="#0d1117"/>

  <!-- USER -->
  <rect x="280" y="24" width="120" height="44" rx="8" fill="#21262d" stroke="#30363d" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" dominant-baseline="central" fill="#e6edf3" font-size="14" font-weight="500">User</text>

  <!-- Arrow: User → Frontend -->
  <line x1="340" y1="68" x2="340" y2="106" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FRONTEND CONTAINER -->
  <rect x="40" y="108" width="600" height="150" rx="14" fill="#1c1d52" stroke="#534AB7" stroke-width="0.5" fill-opacity="0.5"/>
  <text x="56" y="130" dominant-baseline="central" fill="#AFA9EC" font-size="14" font-weight="500">Frontend</text>
  <text x="56" y="147" dominant-baseline="central" fill="#7F77DD" font-size="12">Next.js 15 · TypeScript · Tailwind CSS</text>

  <!-- Frontend: Upload page -->
  <rect x="60" y="160" width="128" height="72" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="124" y="187" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">Upload page</text>
  <text x="124" y="208" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="12">PDF file input</text>

  <!-- Frontend: Review page -->
  <rect x="208" y="160" width="128" height="72" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="272" y="187" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">Review page</text>
  <text x="272" y="208" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="12">Edit events</text>

  <!-- Frontend: Calendar preview -->
  <rect x="356" y="160" width="148" height="72" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="430" y="187" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">Calendar preview</text>
  <text x="430" y="208" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="12">FullCalendar · ical.js</text>

  <!-- Frontend: ICS export -->
  <rect x="524" y="160" width="100" height="72" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="574" y="187" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">ICS export</text>
  <text x="574" y="208" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="12">Download .ics</text>

  <!-- Frontend internal arrows -->
  <line x1="188" y1="196" x2="206" y2="196" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="336" y1="196" x2="354" y2="196" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="504" y1="196" x2="522" y2="196" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- API label -->
  <text x="340" y="282" text-anchor="middle" dominant-baseline="central" fill="#484f58" font-size="12">REST API · HTTP/JSON</text>
  <line x1="180" y1="278" x2="280" y2="278" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="278" x2="500" y2="278" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Bidirectional arrows Frontend ↔ Backend -->
  <line x1="310" y1="258" x2="310" y2="300" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="300" x2="370" y2="258" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BACKEND CONTAINER -->
  <rect x="40" y="304" width="600" height="150" rx="14" fill="#04342C" stroke="#0F6E56" stroke-width="0.5" fill-opacity="0.6"/>
  <text x="56" y="326" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">Backend</text>
  <text x="56" y="343" dominant-baseline="central" fill="#1D9E75" font-size="12">FastAPI · Python · Pydantic</text>

  <!-- Backend: PDF parser -->
  <rect x="60" y="356" width="116" height="72" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="118" y="383" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">PDF parser</text>
  <text x="118" y="404" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="12">PyMuPDF</text>

  <!-- Backend: Text cleaner -->
  <rect x="196" y="356" width="116" height="72" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="254" y="383" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">Text cleaner</text>
  <text x="254" y="404" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="12">Normalise content</text>

  <!-- Backend: AI service -->
  <rect x="332" y="356" width="116" height="72" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="383" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">AI service</text>
  <text x="390" y="404" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="12">LangChain chain</text>

  <!-- Backend: ICS generator -->
  <rect x="468" y="356" width="152" height="72" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="544" y="383" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">ICS generator</text>
  <text x="544" y="404" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="12">icalendar · dateutil</text>

  <!-- Backend internal arrows -->
  <line x1="176" y1="392" x2="194" y2="392" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="312" y1="392" x2="330" y2="392" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="448" y1="392" x2="466" y2="392" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrow: AI service → AI pipeline (down) -->
  <line x1="390" y1="428" x2="390" y2="490" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: AI pipeline → AI service (up, result) -->
  <line x1="440" y1="490" x2="440" y2="428" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AI PIPELINE CONTAINER -->
  <rect x="40" y="494" width="600" height="122" rx="14" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5" fill-opacity="0.5"/>
  <text x="56" y="516" dominant-baseline="central" fill="#F5C4B3" font-size="14" font-weight="500">AI pipeline</text>
  <text x="56" y="533" dominant-baseline="central" fill="#D85A30" font-size="12">LangChain · OpenAI API (GPT-4)</text>

  <!-- AI: Prompt template -->
  <rect x="60" y="544" width="148" height="46" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
  <text x="134" y="567" text-anchor="middle" dominant-baseline="central" fill="#F5C4B3" font-size="14" font-weight="500">Prompt template</text>

  <!-- AI: Course outline chain -->
  <rect x="228" y="544" width="168" height="46" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
  <text x="312" y="567" text-anchor="middle" dominant-baseline="central" fill="#F5C4B3" font-size="14" font-weight="500">Outline chain</text>

  <!-- AI: Event schema -->
  <rect x="416" y="544" width="204" height="46" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
  <text x="518" y="567" text-anchor="middle" dominant-baseline="central" fill="#F5C4B3" font-size="14" font-weight="500">Structured event schema</text>

  <!-- AI internal arrows -->
  <line x1="208" y1="567" x2="226" y2="567" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="396" y1="567" x2="414" y2="567" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
